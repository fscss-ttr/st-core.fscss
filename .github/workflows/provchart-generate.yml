name: Test ProvChart Action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is non-empty
        env:
          KEY: ${{ secrets.PROVCHART_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secrets.PROVCHART_API_KEY is empty for this repo"
            echo "Create a Repository secret named exactly PROVCHART_API_KEY"
            exit 1
          fi
          echo "Secret length: ${#KEY} (OK, value not printed)"

      - name: Generate SVGs
        uses: fscss-ttr/provchart-readme-action@v1.0.3
        with:
          api-key: ${{ secrets.PROVCHART_API_KEY }}
        env:
          PROVCHART_API_KEY: ${{ secrets.PROVCHART_API_KEY }}
          INPUT_CONFIG: .provchart/charts.json
          INPUT_OUTPUT_DIR: docs/charts

      - name: Commit generated charts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update generated ProvChart SVGs"
          file_pattern: "docs/charts/*.svg"
